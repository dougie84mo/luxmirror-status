commitMessages:
  readmeContent: ":pencil: Update summary in README [skip ci] [skip upptime]"
  summaryJson: ":card_file_box: Update status summary [skip ci] [skip upptime]"
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [skip upptime]"
  graphsUpdate: ":bento: Update graphs [skip ci] [skip upptime]"
