# Upptime configuration for status.theluxmirror.com (2026-11-02).
# Drop this file at the root of the repo created from the upptime/upptime
# template (dougie84mo/luxmirror-status) and commit. Docs: upptime.js.org/docs
#
# Secrets the repo needs (Settings → Secrets → Actions):
#   GH_PAT                 a token with repo scope (Upptime commits results)
#   SUPABASE_ANON_KEY      the publishable key, for the REST check below
#
# Each check runs every 5 minutes from GitHub Actions. Third-party status
# feeds are checked for "indicator":"none" so a Stripe or Supabase incident
# shows on our page as theirs, not ours.

owner: dougie84mo
repo: luxmirror-status
user-agent: luxmirror-status

sites:
  - name: theluxmirror.com
    url: https://theluxmirror.com
    expectedStatusCodes: [200]
  - name: Help center
    url: https://support.theluxmirror.com
    expectedStatusCodes: [200]
  - name: Staff console
    url: https://admin.theluxmirror.com
    expectedStatusCodes: [200]
  - name: Cloud — sign-in
    url: https://ywmeghkhswixaueptfrt.supabase.co/auth/v1/health
    expectedStatusCodes: [200]
  - name: Cloud — data
    url: https://ywmeghkhswixaueptfrt.supabase.co/rest/v1/
    headers:
      - "apikey: $SUPABASE_ANON_KEY"
    expectedStatusCodes: [200]
  - name: Cloud — functions
    url: https://ywmeghkhswixaueptfrt.supabase.co/functions/v1/status-health
    expectedStatusCodes: [200]
  - name: Payments provider (Stripe)
    url: https://status.stripe.com/api/v2/status.json
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"indicator":"none"'
  - name: Cloud provider (Supabase)
    url: https://status.supabase.com/api/v2/status.json
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"indicator":"none"'

status-website:
  cname: status.theluxmirror.com
  name: LUX status
  theme: dark
  logoUrl: https://theluxmirror.com/icon.svg
  introTitle: "Is it the mirror, or is it the cloud?"
  introMessage: >-
    Live checks on theluxmirror.com, the help center, the staff console, the
    cloud behind the LUX Mirror and LUX Booking apps, and the providers we
    build on. A mirror that is offline while everything here is up is a
    power or Wi-Fi problem at the chair — the help center has the steps.
  navbar:
    - title: Status
      href: /
    - title: Help center
      href: https://support.theluxmirror.com
    - title: Open a ticket
      href: https://support.theluxmirror.com/ticket
    - title: support@theluxmirror.com
      href: mailto:support@theluxmirror.com

